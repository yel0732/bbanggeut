name: a501

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    # host 네트워크의 ai-server가 접근할 통로. internal 네트워크(data)만 붙은
    # 컨테이너에는 포트 publish가 동작하지 않아 edge에도 붙인다. 호스트
    # loopback에만 바인딩하므로 외부에는 여전히 노출되지 않는다.
    ports:
      - 127.0.0.1:6379:6379
    networks:
      - data
      - edge
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  ai-server:
    image: ${AI_SERVER_IMAGE:-a501-ai-server}
    build:
      context: ./ai-server
    restart: unless-stopped
    # WebRTC 미디어(UDP)는 nginx를 거치지 않고 브라우저와 이 프로세스가 직접 붙는다.
    # bridge 네트워크의 MASQUERADE 뒤에서는 aiortc의 srflx 후보로 들어오는 "처음 보는
    # 주소"의 연결성 검사 패킷이 conntrack에 걸려 전부 버려져, 상대가 대칭 NAT(모바일
    # CGNAT 등)이면 ICE가 절대 성립하지 않는다(실측: aioice send_stun 무한 재시도).
    # host 네트워크로 도커 NAT를 제거하면 EC2의 1:1 NAT(포트 보존)만 남아 인바운드가
    # 소켓까지 도달한다. 8000/TCP는 UFW가 외부를 막고, nginx·backend만 게이트웨이로
    # 접근한다. 서비스명 DNS를 잃으므로 redis·backend는 호스트 loopback publish로 간다.
    network_mode: host
    environment:
      GMS_KEY: ${GMS_KEY:?GMS_KEY is required}
      GMS_BASE_URL: ${GMS_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com/v1}
      GMS_ANALYSIS_MODEL: ${GMS_ANALYSIS_MODEL:-gpt-5.4-nano}
      GMS_RESPONSE_MODEL: ${GMS_RESPONSE_MODEL:-gpt-5-mini}
      GMS_REPORT_MODEL: ${GMS_REPORT_MODEL:-gpt-5-mini}
      GMS_CHILD_DIARY_MODEL: ${GMS_CHILD_DIARY_MODEL:-gpt-5-mini}
      REALTIME_REDIS_HOST: 127.0.0.1
      REALTIME_REDIS_PORT: 6379
      # 8080은 호스트에서 Jenkins가 쓰고 있어 backend는 18080으로 publish한다.
      REALTIME_JWKS_URL: http://127.0.0.1:18080/internal/v1/realtime/jwks
      REALTIME_TICKET_ISSUER: ${REALTIME_TICKET_ISSUER:-spring-backend}
      REALTIME_TICKET_AUDIENCE: ${REALTIME_TICKET_AUDIENCE:-ai-realtime}
      # NAT 뒤 배포에서 aiortc가 공인 IP(srflx) 후보를 얻는 경로. 비우면 사설 IP
      # 후보만 내서 외부 브라우저와 절대 연결되지 않는다.
      # REALTIME_ICE_SERVERS는 이 서비스가 아니라 backend로 간다 — 브라우저에
      # 내려주는 값이라 ai-server는 읽지 않는다.
      REALTIME_STUN_URLS: ${REALTIME_STUN_URLS:-stun:stun.l.google.com:19302}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:-a501-backend}
    build:
      context: ./backend
    restart: unless-stopped
    # host 네트워크의 ai-server가 JWKS를 읽는 통로. 8080은 Jenkins가 선점했다.
    ports:
      - 127.0.0.1:18080:8080
    # ai-server가 서비스명 DNS 밖(host 네트워크)에 있으므로 게이트웨이 별칭으로 접근한다.
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: ${BACKEND_PROFILES:-prod}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVER_BASE_URL: http://host.docker.internal:8000
      REALTIME_SIGNALING_URL: ${REALTIME_SIGNALING_URL:-ws://localhost/realtime/signaling}
      # 브라우저에 내려줄 ICE 서버. ai-server의 REALTIME_STUN_URLS와 짝 — 양쪽 모두
      # 있어야 브라우저·서버가 서로 도달 가능한 공인 후보를 낸다.
      REALTIME_ICE_SERVERS: ${REALTIME_ICE_SERVERS:-stun:stun.l.google.com:19302}
      REALTIME_TICKET_PRIVATE_KEY_PEM: ${REALTIME_TICKET_PRIVATE_KEY_PEM:?REALTIME_TICKET_PRIVATE_KEY_PEM is required}
      REALTIME_TICKET_PUBLIC_KEY_PEM: ${REALTIME_TICKET_PUBLIC_KEY_PEM:?REALTIME_TICKET_PUBLIC_KEY_PEM is required}
      REALTIME_TICKET_ISSUER: ${REALTIME_TICKET_ISSUER:-spring-backend}
      REALTIME_TICKET_AUDIENCE: ${REALTIME_TICKET_AUDIENCE:-ai-realtime}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      REPORT_SCHEDULE_ENABLED: ${REPORT_SCHEDULE_ENABLED:-true}
      REPORT_DAILY_CRON: ${REPORT_DAILY_CRON:-0 * * * * *}
      REPORT_RECOVERY_ENABLED: ${REPORT_RECOVERY_ENABLED:-true}
      # 탈퇴 계정의 실제 데이터 파기 스위치. 꺼져 있으면 탈퇴가 soft delete와 익명화까지만
      # 진행되는데, 익명화 덕분에 재가입이 정상 동작해 증상이 드러나지 않은 채 데이터만 쌓인다.
      # 기본값을 false로 두는 이유: 되돌릴 수 없는 물리 삭제라 배포 환경이 명시적으로 켜야 한다.
      ACCOUNT_PURGE_ENABLED: ${ACCOUNT_PURGE_ENABLED:-false}
      ACCOUNT_PURGE_CRON: ${ACCOUNT_PURGE_CRON:-0 */5 * * * *}
      # 탈퇴 후 이 기간이 지나야 파기한다. 0d = 즉시 파기(같은 이메일 재가입을 곧바로 허용).
      ACCOUNT_PURGE_GRACE_PERIOD: ${ACCOUNT_PURGE_GRACE_PERIOD:-0d}
      # AWS SDK reads credentials from the container OS environment.
      # Keep the real values only in /srv/a501-secrets/.env on EC2.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:?STORAGE_PROVIDER is required}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_UPLOAD_BUCKET: ${S3_UPLOAD_BUCKET:?S3_UPLOAD_BUCKET is required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # 실시간 대화 파이프라인 스위치 — 꺼져 있으면 FastAPI가 발행한 대화 이벤트가
      # MySQL에 반영되지 않고(일기 생성 불가), 끊긴 세션 정리도 되지 않는다.
      CONVERSATION_STREAM_ENABLED: ${CONVERSATION_STREAM_ENABLED:-true}
      CONVERSATION_STREAM_RECOVERY_ENABLED: ${CONVERSATION_STREAM_RECOVERY_ENABLED:-true}
      REALTIME_RECONCILER_ENABLED: ${REALTIME_RECONCILER_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-server:
        condition: service_healthy
    networks:
      - edge
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:8080/actuator/health >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  nginx:
    image: ${NGINX_IMAGE:-a501-nginx}
    build:
      context: .
      dockerfile: deploy/nginx.Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
    restart: unless-stopped
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    # /realtime/ 프록시 대상인 ai-server가 host 네트워크로 옮겨가 서비스명 DNS에
    # 없다 — nginx.conf의 upstream이 이 별칭으로 게이트웨이를 넘어 접근한다.
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${NGINX_CONFIG_FILE:-./deploy/nginx-http.conf}:/etc/nginx/nginx.conf:ro
      - ${CERTBOT_WEBROOT:-./deploy/certbot/www}:/var/www/certbot:ro
      - ${LETSENCRYPT_LIVE_DIR:-./deploy/certbot/letsencrypt/live/i15a501.p.ssafy.io}:/etc/letsencrypt/live/i15a501.p.ssafy.io:ro
      - ${LETSENCRYPT_ARCHIVE_DIR:-./deploy/certbot/letsencrypt/archive/i15a501.p.ssafy.io}:/etc/letsencrypt/archive/i15a501.p.ssafy.io:ro
    depends_on:
      backend:
        condition: service_healthy
      ai-server:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # --- 모니터링 (선택 스택) -------------------------------------------------
  # `docker compose --profile monitoring up -d`로만 뜬다. 기본 스택 기동에는
  # 영향이 없고, 어떤 메트릭 포트도 외부에 publish하지 않는다 — 외부 접근은
  # nginx 뒤의 Grafana(/grafana/) 하나뿐이다. 상세: docs/MONITORING.md.

  prometheus:
    image: prom/prometheus:v2.53.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # ai-server가 host 네트워크라 서비스명 DNS에 없다 — nginx와 같은 방식으로
    # 게이트웨이 별칭을 써서 스크레이프한다.
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - edge
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # 기본값은 로컬 개발용이다. 배포 .env에서 반드시 덮어쓴다(MONITORING.md).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # nginx가 /grafana/ 경로로 프록시하므로 서브패스 서빙이 필요하다.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - edge
    logging: *default-logging

  # 호스트 CPU/RAM/디스크. 리눅스 호스트 전용이라 별도 profile로 분리한다 —
  # Windows/macOS 로컬에서는 monitoring만 켜고 이건 켜지 않는다(마운트 불가).
  # EC2: docker compose --profile monitoring --profile host-metrics up -d
  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: [host-metrics]
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - edge
    logging: *default-logging

networks:
  edge:
  data:
    internal: true

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
