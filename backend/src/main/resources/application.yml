spring:
  application:
    name: backend
  profiles:
    default: local
  batch:
    job:
      enabled: false

report:
  schedule:
    enabled: ${REPORT_SCHEDULE_ENABLED:false}
    cron: ${REPORT_DAILY_CRON:0 0 19 * * *}
    zone: Asia/Seoul

app:
  jwt:
    access-token-expiry-minutes: 30
    signup-token-expiry-minutes: 10
    link-token-expiry-minutes: 10
  refresh-token:
    remember-me-expiry-days: 60
    default-expiry-days: 1
  cookie:
    secure: true

---
# 로컬 개발용: H2 인메모리 DB
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:a501;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  batch:
    jdbc:
      initialize-schema: always
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-CHANGE-ME-this-is-not-a-real-secret}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  local:
    mock-principal-id: 1
    mock-child-id: 15
    mock-child-owner-id: 1

logging:
  level:
    org.hibernate.SQL: debug

---
# 운영용: MySQL (환경변수로 주입)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID}

management:
  endpoints:
    web:
      exposure:
        include: health
