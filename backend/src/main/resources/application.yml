spring:
  application:
    name: backend
  # 로컬 실행 시 backend/.env 의 값을 환경변수처럼 읽는다. Spring Boot는 .env를 자동으로 읽지
  # 않으므로 이 선언이 없으면 파일을 만들어도 적용되지 않는다. optional: 이라 파일이 없으면 무시하고,
  # 배포 환경에서는 컨테이너 환경변수가 그대로 우선한다(.env를 이미지에 넣지 않는다).
  # .properties 형식으로 파싱되므로 값에 따옴표를 쓰지 않는다.
  config:
    import: optional:file:./.env[.properties]
  profiles:
    default: local
  batch:
    job:
      enabled: false
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      # 애플리케이션 레벨 검증(app.storage.max-image-size → 400 IMAGE_TOO_LARGE)이 먼저 걸리도록
      # 서블릿 한도는 그보다 넉넉히 잡는다. 이 값은 명백한 악용을 막는 최후 방어선이다.
      max-file-size: 10MB
      max-request-size: 12MB

report:
  schedule:
    enabled: ${REPORT_SCHEDULE_ENABLED:false}
    cron: ${REPORT_DAILY_CRON:0 0 19 * * *}
    zone: Asia/Seoul
  retry:
    max-attempts: ${REPORT_RETRY_MAX_ATTEMPTS:3}
    interval: ${REPORT_RETRY_INTERVAL:PT5S}
  recovery:
    enabled: ${REPORT_RECOVERY_ENABLED:false}
    interval: ${REPORT_RECOVERY_INTERVAL:PT1M}
    initial-delay: ${REPORT_RECOVERY_INITIAL_DELAY:PT30S}
    stale-processing-threshold: ${REPORT_STALE_PROCESSING_THRESHOLD:PT10M}
    batch-size: ${REPORT_RECOVERY_BATCH_SIZE:100}
  notification:
    sse:
      # SseEmitter 생성 시 타임아웃으로 사용되어 서블릿 async 타임아웃과 일치시킨다.
      timeout: ${REPORT_SSE_TIMEOUT:PT30M}
      heartbeat-interval: ${REPORT_SSE_HEARTBEAT:PT15S}

conversation:
  stream:
    key: ${CONVERSATION_STREAM_KEY:conversation-events}
    group: ${CONVERSATION_STREAM_GROUP:spring-conversation-consumers}
    enabled: ${CONVERSATION_STREAM_ENABLED:false}
    poll-interval: ${CONVERSATION_STREAM_POLL_INTERVAL:PT1S}
    batch-size: ${CONVERSATION_STREAM_BATCH_SIZE:20}
    recovery:
      enabled: ${CONVERSATION_STREAM_RECOVERY_ENABLED:false}
      interval: ${CONVERSATION_STREAM_RECOVERY_INTERVAL:PT30S}
      initial-delay: ${CONVERSATION_STREAM_RECOVERY_INITIAL_DELAY:PT10S}
      min-idle: ${CONVERSATION_STREAM_RECOVERY_MIN_IDLE:PT30S}
      max-attempts: ${CONVERSATION_STREAM_RECOVERY_MAX_ATTEMPTS:3}
      batch-size: ${CONVERSATION_STREAM_RECOVERY_BATCH_SIZE:100}
  ai:
    base-url: ${AI_SERVER_BASE_URL:http://127.0.0.1:8000}
    timeout: ${AI_SERVER_TIMEOUT:PT30S}
  topic:
    game-max-question-count: ${CONVERSATION_GAME_MAX_QUESTIONS:6}
    daily-max-question-count: ${CONVERSATION_DAILY_MAX_QUESTIONS:6}
  realtime:
    context:
      ttl: ${CONVERSATION_REALTIME_CONTEXT_TTL:PT30M}
    session:
      signaling-url: ${REALTIME_SIGNALING_URL:ws://localhost:8000/realtime/signaling}
      ice-servers: []
      lease-ttl: ${REALTIME_SESSION_LEASE_TTL:PT15S}
    ticket:
      issuer: ${REALTIME_TICKET_ISSUER:spring-backend}
      audience: ${REALTIME_TICKET_AUDIENCE:ai-realtime}
      ttl: ${REALTIME_TICKET_TTL:PT5M}
    reconciler:
      enabled: ${REALTIME_RECONCILER_ENABLED:false}
      interval: ${REALTIME_RECONCILER_INTERVAL:PT10S}

child-diary:
  ai:
    base-url: ${AI_SERVER_BASE_URL:http://127.0.0.1:8000}
    timeout: ${CHILD_DIARY_AI_TIMEOUT:PT12S}
  preview:
    secret: ${CHILD_DIARY_PREVIEW_SECRET:${JWT_SECRET:local-child-diary-preview-secret-change-me}}
    ttl: ${CHILD_DIARY_PREVIEW_TTL:PT10M}

app:
  jwt:
    access-token-expiry-minutes: 30
    signup-token-expiry-minutes: 10
    link-token-expiry-minutes: 10
  refresh-token:
    remember-me-expiry-days: 60
    default-expiry-days: 1
  cookie:
    secure: true
  pin:
    max-failed-attempts: 5
    lock-duration: 5m
  child:
    max-profile-count: 10
  storage:
    # local = 메모리 가짜 저장소(AWS 불필요), s3 = 실제 S3.
    # Spring 프로필과 분리한 이유: 프로필로 묶으면 "로컬 H2 + 진짜 S3" 조합이 불가능해져
    # 개발자가 개인 AWS 버킷으로 미리 검증할 수 없다.
    provider: ${STORAGE_PROVIDER:local}
    # 버킷·리전은 배포 환경마다 다르므로 환경변수로 주입한다. 자격증명은 여기에 두지 않고
    # AWS 기본 자격증명 체인(환경변수·IAM 역할)에 맡긴다.
    #
    # S3 버킷은 업로드(웹캠 촬영, 아이 실물 사진)용 하나뿐이다. 프리셋은 프론트엔드 번들 이미지라
    # S3에 두지 않으며, 공개 버킷을 아예 만들지 않으므로 공개 설정 실수 자체가 불가능하다.
    #
    # 기본값을 비워둔다 — 값을 넣어두면 우리가 소유하지도 않은 버킷 이름으로 조용히 뜬 뒤 아이
    # 사진을 올리는 시점에야 실패한다. provider=s3 인데 비어 있으면 S3StorageConfig가 기동을 막는다.
    upload-bucket: ${S3_UPLOAD_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    # 접두사가 "프론트 번들 프리셋 식별자"와 "S3 객체 키"를 구분한다.
    preset-prefix: profile-presets/
    upload-prefix: profile-uploads/
    # 부모와 자녀의 기본 이미지가 서로 다르다.
    default-parent-preset-key: profile-presets/parent-avatar
    default-child-preset-key: profile-presets/child-avatar
    # 프론트 에셋(frontend/src/assets/images/profile/*.webp) 파일명과 1:1로 대응한다.
    # 확장자는 키에 넣지 않는다 — 이미지 포맷이 바뀌어도 DB 값을 고치지 않기 위함.
    # 여기에 없는 키는 클라이언트가 지정해도 거부된다(ProfileImageService.assertValidPreset).
    preset-keys:
      - profile-presets/parent-avatar
      - profile-presets/child-avatar
      - profile-presets/child-avatar-tiger
      - profile-presets/child-avatar-rabbit
    max-image-size: 2MB
    presigned-url-ttl: 5m

---
# 로컬 개발용: H2 인메모리 DB
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:a501;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  batch:
    jdbc:
      initialize-schema: always
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-CHANGE-ME-this-is-not-a-real-secret}
  google:
    client-id: ${GOOGLE_CLIENT_ID:737186420019-trrstol7c5cvf919t15l4o4g866hpp77.apps.googleusercontent.com}
  cors:
    allowed-origins: http://localhost:*
  cookie:
    secure: false
  local:
    mock-principal-id: 1
    mock-child-id: 15
    mock-child-owner-id: 1

logging:
  level:
    org.hibernate.SQL: debug

---
# 운영용: MySQL (환경변수로 주입)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  batch:
    jdbc:
      initialize-schema: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

conversation:
  realtime:
    ticket:
      private-key-pem: ${REALTIME_TICKET_PRIVATE_KEY_PEM}
      public-key-pem: ${REALTIME_TICKET_PUBLIC_KEY_PEM}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

report:
  ai:
    enabled: ${REPORT_AI_ENABLED:true}
    base-url: ${AI_SERVER_BASE_URL:http://127.0.0.1:8000}
    timeout: ${REPORT_AI_TIMEOUT:PT12S}
  schedule:
    enabled: ${REPORT_SCHEDULE_ENABLED:true}
  recovery:
    enabled: ${REPORT_RECOVERY_ENABLED:true}
